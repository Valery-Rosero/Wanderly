name: wanderly
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # 🌐 Backend y APIs
  supabase_flutter: ^2.5.0
  google_generative_ai: ^0.4.0
  dio: ^5.3.0
  http: ^1.1.0

  # 📍 Geolocalización y mapas
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  google_maps_flutter: ^2.6.0

  # 💾 Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  sqflite: ^2.3.0

  # 🧠 Estado e inyección de dependencias
  flutter_bloc: ^9.1.1
  equatable: ^2.0.5
  get_it: ^9.0.5
  get:

  # 🎨 UI y utilidades
  flutter_dotenv: ^6.0.0
  cached_network_image: ^3.3.0
  url_launcher: ^6.2.0
  cupertino_icons: ^1.0.8
  bloc: ^9.1.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  flutter_markdown: ^0.7.2+1
  image_picker: ^1.0.7
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ⚙️ Generadores y linter
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

